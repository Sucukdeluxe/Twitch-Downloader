name: macOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  TVM_STRICT_LOCAL_CHECKS: 'true'

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            folder: mac-arm64
          - runner: macos-15-intel
            arch: x64
            folder: mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run lint
      - run: npm run security:check
      - run: npm run test:security && npm run test:lint-config && npm run test:ci-contract
      - run: npm run test:unit
      - run: npm run rebuild:electron
      - run: npm run tools:mac -- ${{ matrix.arch }}
      - run: npm run test:mac-update
        timeout-minutes: 10
      - run: npm run test:mac
        timeout-minutes: 10
      - run: PATH="$PWD/.cache/macos-tools/stage-${{ matrix.arch }}/ffmpeg:$PATH" npm run test:e2e:release
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macos-${{ matrix.arch }}-diagnostics
          path: artifacts/

  # Validate the packaged app independently on both native architectures.
  # E2E runs use authenticated encryption with per-test, in-memory keys and
  # explicitly block native Keychain calls; no login-Keychain prompts are needed.
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            folder: mac-arm64
          - runner: macos-15-intel
            arch: x64
            folder: mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run tools:mac -- ${{ matrix.arch }}
      - run: npm run dist:mac -- --${{ matrix.arch }} -c.mac.identity=- --publish never
      - name: Test the actual application bundle
        run: npm run test:mac
        timeout-minutes: 10
        env:
          PACKAGED_APP_PATH: release/${{ matrix.folder }}/Twitch VOD Manager.app/Contents/MacOS/Twitch VOD Manager
      - name: Fetch original 1.0.10 update source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/original-release
          gh release download mac-v1.0.10 --repo Sucukdeluxe/Twitch-Downloader-macos --pattern "Twitch-VOD-Manager-1.0.10-mac-${{ matrix.arch }}.zip" --dir .cache/original-release
          if [ "${{ matrix.arch }}" = arm64 ]; then
            expected=943aa43944b40bdac42fa820a7ceee87addc673fbed256deb67fe6a4760926c1
          else
            expected=4a06cc4eecff18cb65f19553ff925fa3bfa7c3db8515667e6f162640846ec5bd
          fi
          echo "$expected  .cache/original-release/Twitch-VOD-Manager-1.0.10-mac-${{ matrix.arch }}.zip" | shasum -a 256 -c -
          ditto -x -k ".cache/original-release/Twitch-VOD-Manager-1.0.10-mac-${{ matrix.arch }}.zip" .cache/original-release
      - name: Verify actual old-to-new application update
        run: node scripts/smoke-test-macos-update.js
        env:
          MAC_UPDATE_FROM_APP: .cache/original-release/Twitch VOD Manager.app
        timeout-minutes: 10
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: macos-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*mac*.yml
            release/*.blockmap
