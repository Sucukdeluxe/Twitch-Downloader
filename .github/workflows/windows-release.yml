name: Unified verified release

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: unified-release-${{ startsWith(github.ref, 'refs/tags/') && 'stable' || github.ref }}
  cancel-in-progress: false

env:
  TVM_STRICT_LOCAL_CHECKS: 'true'

jobs:
  prepare:
    if: github.repository == 'Sucukdeluxe/Twitch-Downloader'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: version
        run: node -e "const fs=require('node:fs'); const {version}=require('./package.json'); if(process.env.GITHUB_REF.startsWith('refs/tags/') && process.env.GITHUB_REF !== 'refs/tags/v'+version) throw Error('Tag/package version mismatch'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version='+version+'\n');"

  verify-webkit:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: brew install ffmpeg
      - name: Verify WebKit with macOS media codecs
        run: node scripts/release-gate.mjs --webkit-only
      - uses: actions/upload-artifact@v4
        with:
          name: webkit-verification-${{ github.sha }}
          if-no-files-found: error
          path: release/verification/webkit.json
      - name: Upload WebKit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          path: release/verification/*.log

  verify-package:
    needs: verify-webkit
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
      - name: Validate release version
        shell: pwsh
        run: |
          node -e "const p=require('./package.json'); if(process.env.GITHUB_REF.startsWith('refs/tags/') && process.env.GITHUB_REF !== 'refs/tags/v'+p.version) throw Error('Tag/package version mismatch');"
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Provision Chromium
        run: npx playwright install chromium
      - uses: actions/download-artifact@v4
        with:
          name: webkit-verification-${{ github.sha }}
          path: release/webkit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provision Streamlink
        run: python -m pip install streamlink==8.6.3
      - name: Provision media fixtures
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify and build production installer
        env:
          RELEASE_WEBKIT_RECEIPT: release/webkit/webkit.json
        run: npm run release:build
      - name: Upload verified installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.sha }}
          if-no-files-found: error
          path: |
            release/Twitch-Downloader-Setup-*.exe
            release/Twitch-Downloader-Setup-*.exe.blockmap
            release/latest.yml
            release/verification/receipt.json
            release/verification/package.json
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-verification-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            release/verification/*.log
            release/verification/unit.json

  verify-macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run lint
      - run: npm run security:check
      - run: npm run test:security && npm run test:lint-config && npm run test:ci-contract
      - run: npm run tools:mac -- ${{ matrix.arch }}
      - run: npm run test:unit
        env:
          FFMPEG_PATH: .cache/macos-tools/stage-${{ matrix.arch }}/ffmpeg/ffmpeg
          FFPROBE_PATH: .cache/macos-tools/stage-${{ matrix.arch }}/ffmpeg/ffprobe
      - run: npm run rebuild:electron
      - run: npm run test:mac-update
        timeout-minutes: 10
      - run: npm run test:mac
        timeout-minutes: 10
      - run: PATH="$PWD/.cache/macos-tools/stage-${{ matrix.arch }}/ffmpeg:$PATH" npm run test:e2e:release
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-${{ matrix.arch }}-diagnostics
          path: artifacts/

  package-macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            folder: mac-arm64
          - runner: macos-15-intel
            arch: x64
            folder: mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run tools:mac -- ${{ matrix.arch }}
      - run: npm run dist:mac -- --${{ matrix.arch }} -c.mac.identity=- --publish never
        env:
          CSC_FOR_PULL_REQUEST: 'true'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify the packaged code signature
        run: codesign --verify --deep --strict "release/${{ matrix.folder }}/Twitch VOD Manager.app"
      - name: Test the actual application bundle on a fresh runner
        run: npm run test:mac
        timeout-minutes: 10
        env:
          PACKAGED_APP_PATH: release/${{ matrix.folder }}/Twitch VOD Manager.app/Contents/MacOS/Twitch VOD Manager
      - name: Fetch original 1.0.10 update source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/original-release
          gh release download mac-v1.0.10 --repo Sucukdeluxe/Twitch-Downloader-macos --pattern "Twitch-VOD-Manager-1.0.10-mac-${{ matrix.arch }}.zip" --dir .cache/original-release
          if [ "${{ matrix.arch }}" = arm64 ]; then
            expected=943aa43944b40bdac42fa820a7ceee87addc673fbed256deb67fe6a4760926c1
          else
            expected=4a06cc4eecff18cb65f19553ff925fa3bfa7c3db8515667e6f162640846ec5bd
          fi
          echo "$expected  .cache/original-release/Twitch-VOD-Manager-1.0.10-mac-${{ matrix.arch }}.zip" | shasum -a 256 -c -
          ditto -x -k ".cache/original-release/Twitch-VOD-Manager-1.0.10-mac-${{ matrix.arch }}.zip" .cache/original-release
      - name: Verify actual old-to-new application update
        run: node scripts/smoke-test-macos-update.js
        env:
          MAC_UPDATE_FROM_APP: .cache/original-release/Twitch VOD Manager.app
        timeout-minutes: 10
      - name: Record tested Mac artifact hashes
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: node scripts/publish-unified-release.cjs --record-mac
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/Twitch-VOD-Manager-${{ needs.prepare.outputs.version }}-mac-${{ matrix.arch }}.dmg
            release/Twitch-VOD-Manager-${{ needs.prepare.outputs.version }}-mac-${{ matrix.arch }}.zip
            release/mac-proof-${{ matrix.arch }}.json

  publish:
    if: github.repository == 'Sucukdeluxe/Twitch-Downloader' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, verify-webkit, verify-package, verify-macos, package-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-${{ github.sha }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          pattern: release-macos-*
          merge-multiple: true
          path: release
      - name: Verify, publish unified assets and dispatch the Mac compatibility feed
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_RELEASE_DEPLOY_KEY: ${{ secrets.MAC_RELEASE_DEPLOY_KEY }}
        run: node scripts/publish-unified-release.cjs
