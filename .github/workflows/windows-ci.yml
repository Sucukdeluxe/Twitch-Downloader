name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'Sucukdeluxe/Twitch-Downloader'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CI: 'true'
      TVM_STRICT_LOCAL_CHECKS: 'true'
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 10
      - uses: actions/setup-node@v4
        timeout-minutes: 10
        with:
          node-version: '24.11.1'
          cache: npm
      - name: Clean install
        run: npm ci
        timeout-minutes: 10
      - name: Provision Electron binary
        run: |
          npx install-electron --no
          if ($LASTEXITCODE -ne 0) {
            npx install-electron --no
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        timeout-minutes: 10
      - name: Lint
        run: npm run lint
        timeout-minutes: 10
      - name: Security contracts
        run: npm run security:check
        timeout-minutes: 10
      - name: Provision FFmpeg for decoded-media unit tests
        run: |
          choco install ffmpeg --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        timeout-minutes: 10
      - name: Unit and static regression contracts
        run: |
          npm run test:unit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:security
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:lint-config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ci-contract
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        timeout-minutes: 10
      - name: Build
        run: npm run build
        timeout-minutes: 10
      - name: Native regression environment
        run: npm run rebuild:electron
        timeout-minutes: 10
      - name: Isolated workspace regressions
        run: npm run test:e2e:focused
        timeout-minutes: 10
      - name: Package directory
        run: |
          npm run pack
          if ($LASTEXITCODE -ne 0) {
            npm run pack
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        timeout-minutes: 10
      - name: Build installer
        run: |
          npm run dist:ci
          if ($LASTEXITCODE -ne 0) {
            npm run dist:ci
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        timeout-minutes: 10
