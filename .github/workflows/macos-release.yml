name: macOS compatibility relay

on:
  push:
    tags: ['mac-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing immutable mac-vX.Y.Z tag from the canonical release'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  relay:
    if: github.repository == 'Sucukdeluxe/Twitch-Downloader-macos'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: macos-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Verify canonical provenance and relay unchanged Mac assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          MAC_UPDATE_PRIVATE_KEY: ${{ secrets.MAC_UPDATE_PRIVATE_KEY }}
        run: node scripts/publish-macos-relay.cjs
