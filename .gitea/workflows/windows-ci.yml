name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 10
      - uses: actions/setup-node@v4
        timeout-minutes: 10
        with:
          node-version: '24.11.1'
          cache: npm
      - name: Clean install
        run: npm ci
        timeout-minutes: 10
      - name: Provision Electron binary
        run: |
          npx install-electron --no
          if ($LASTEXITCODE -ne 0) {
            npx install-electron --no
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        timeout-minutes: 10
      - name: Lint
        run: npm run lint
        timeout-minutes: 10
      - name: Security contracts
        run: npm run security:check
        timeout-minutes: 10
      - name: Build
        run: npm run build
        timeout-minutes: 10
      - name: Package directory
        run: |
          npm run pack
          if ($LASTEXITCODE -ne 0) {
            npm run pack
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        timeout-minutes: 10
      - name: Build installer
        run: |
          npm run dist:ci
          if ($LASTEXITCODE -ne 0) {
            npm run dist:ci
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        timeout-minutes: 10
