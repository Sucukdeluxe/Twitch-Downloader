<script>
(() => {
  const root = document.getElementById('statistics-proposals');
  const assets = JSON.parse(document.getElementById('statistics-proposal-assets').textContent);
  const icon = name => '<i data-lucide="' + name + '" aria-hidden="true"></i>';
  const channels = [assets.xrohat, assets.honey, assets.papaplatte];
  const channelIndex = [0,0,1,0,2,0,1,2,0,0,1,2];
  const titles = ['LIVE AUS STUTTGART MIT MICKEY MOUSE | !grover !instant !sourire', 'Minecraft mit den Jungs | Neues Projekt', 'Just Chatting und später Minecraft', 'Zurück in Los Santos | GTA RP', 'Minecraft: Der nächste Versuch', 'Unterwegs in Stuttgart | !instant', 'Community-Abend und neue Spiele', 'Ein langer Abend mit den Jungs', 'LIVE MIT COACH BLASI | !grover', 'Zurück zu Hause | Just Chatting', 'Minecraft und Gespräche', 'Die nächste Challenge'];
  const rawSizes = Array.from({length:186},(_,i)=>1.2+(i%11)*.52).reduce((a,b)=>a+b,0);
  const rawDurations = Array.from({length:186},(_,i)=>i%7===6?58:1000+(i%7)*1800).reduce((a,b)=>a+b,0);
  const timecode = seconds => [Math.floor(seconds/3600),Math.floor(seconds%3600/60),Math.floor(seconds%60)].map(x=>String(x).padStart(2,'0')).join(':');
  const records = Array.from({length:2486}, (_,i) => {
    const offset=i<42?Math.floor(i/6):i<186?7+Math.floor((i-42)/6.3):30+Math.floor((i-186)/8);
    const date=new Date(2026,9,18-offset);
    const sizeGB=(1.2+(i%11)*.52)*742/rawSizes;
    const seconds=(i%7===6?58:1000+(i%7)*1800)*1578240/rawDurations;
    return {id:i,offset,title:titles[i%titles.length],channel:channels[channelIndex[i%channelIndex.length]],cover:assets.covers[channelIndex[i%channelIndex.length]===1?2:i%2],kind:i%7===6?'Clip':i%9===5?'Live':'VOD',date:date.toLocaleDateString('de-DE'),time:["00:42","23:18","21:05"][i%3],sizeGB,seconds,size:sizeGB.toLocaleString('de-DE',{maximumFractionDigits:1})+' GB',duration:timecode(seconds)};
  });
  const metrics = [['Downloads','186','Abgeschlossene Downloads'],['Heruntergeladen','742 GB','Im ausgewählten Zeitraum'],['Videolänge','438 h 24 min','Gesamte Aufnahmedauer'],['Downloadzeit','19 h 12 min','Reine Übertragungszeit']];
  const avatar = channel => '<img class="sp-avatar" src="'+channel.src+'" alt="Profilbild von '+channel.name+'">';
  const channel = c => '<span class="sp-record-channel">'+avatar(c)+'<span>'+c.name+'</span></span>';
  const button = (text,action,ico='',extra='') => '<button type="button" class="sp-button" data-action="'+action+'" '+extra+'>'+ (ico?icon(ico):'')+text+'</button>';
  const title = (name,meta='') => '<div class="sp-panel-title"><h2>'+name+'</h2><span>'+meta+'</span></div>';
  const mini = () => '<div class="sp-mini-kpis">'+metrics.map(m=>'<div><span>'+m[0]+'</span><strong data-metric="'+m[0]+'">'+m[1]+'</strong></div>').join('')+'</div>';
  const kpis = () => '<div class="sp-kpis">'+metrics.map(m=>'<div class="sp-kpi"><span>'+m[0]+'</span><strong data-metric="'+m[0]+'">'+m[1]+'</strong><small>'+m[2]+'</small></div>').join('')+'</div>';
  function activity(mode='bars',heading='Download-Aktivität',rows=records.slice(0,186),range='30',width=500,height=196) {
    const bins=range==='7'?7:30,maxOffset=range==='all'?Math.max(...records.map(r=>r.offset))+1:Number(range);
    const values=Array.from({length:bins},(_,i)=>rows.filter(r=>Math.min(bins-1,Math.floor(r.offset/maxOffset*bins))===bins-1-i).length);
    const maximum=Math.max(2,...values),left=36,right=width-24,bottom=height-30,top=18,step=(right-left)/Math.max(1,bins),y=v=>bottom-v/maximum*(bottom-top);
    const plot = mode==='line' ? '<path class="sp-area" d="M'+left+' '+bottom+' '+values.map((v,i)=>'L'+(left+i*step+step/2)+' '+y(v)).join(' ')+' L'+right+' '+bottom+'Z"/><path class="sp-line-series" d="'+values.map((v,i)=>(i?'L':'M')+(left+i*step+step/2)+' '+y(v)).join(' ')+'"/>' : values.map((v,i)=>'<rect class="sp-series" x="'+(left+i*step+step*.18)+'" y="'+y(v)+'" width="'+Math.min(24,step*.65)+'" height="'+(bottom-y(v))+'" rx="2"><title>'+v+' Downloads</title></rect>').join('');
    const first=new Date(2026,9,19-maxOffset).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});
    return '<section class="sp-panel sp-activity" data-chart-mode="'+mode+'" data-chart-heading="'+heading+'">'+title(heading,rows.length.toLocaleString('de-DE')+' gesamt')+'<svg class="sp-chart" viewBox="0 0 '+width+' '+height+'" role="img" aria-label="Downloads im Zeitraum: '+rows.length+'">'+[top,(top+bottom)/2,bottom].map((v,i)=>'<line class="sp-gridline" x1="36" x2="'+(width-10)+'" y1="'+v+'" y2="'+v+'"/><text x="12" y="'+(v+4)+'">'+[maximum,Math.round(maximum/2),0][i]+'</text>').join('')+plot+'<text x="36" y="'+(height-7)+'">'+first+'</text><text text-anchor="end" x="'+(width-10)+'" y="'+(height-7)+'">18.10.</text></svg></section>';
  }
  function streamers() { return '<section class="sp-panel sp-channels">'+title('Speicher nach Streamer','742 GB')+'<div class="sp-streamers">'+channels.map((c,i)=>'<div class="sp-streamer-row">'+avatar(c)+'<div><strong>'+c.name+'</strong><div class="sp-track"><span style="width:'+[81,39,24][i]+'%"></span></div></div><span>'+[458,192,92][i]+' GB</span></div>').join('')+'</div></section>'; }
  function inventory() {return '<section class="sp-panel sp-folder">'+title('Im Download-Ordner')+'<div class="sp-inventory"><div><span>Dateien</span><strong>642</strong></div><div><span>Belegter Speicher</span><strong>1,82 TB</strong></div><div><span>VODs</span><strong>518</strong></div><div><span>Clips / Live</span><strong>94 / 30</strong></div></div><div class="sp-types" aria-label="72 Prozent VODs, 19 Prozent Clips, 9 Prozent Live"><span></span><span></span><span></span></div><div class="sp-chart-legend"><span>VOD</span><span>Clip</span><span>Live</span></div></section>';}
  function sizes(){return '<section class="sp-panel sp-sizes">'+title('Dateigrößen im Archiv')+'<svg class="sp-chart" viewBox="0 0 450 180" preserveAspectRatio="xMinYMid meet" role="img" aria-label="Dateigrößen: unter 1 GB 124, 1 bis 5 GB 148, 5 bis 20 GB 271, über 20 GB 99">'+['< 1 GB','1–5 GB','5–20 GB','> 20 GB'].map((label,i)=>'<text x="0" y="'+(24+i*41)+'">'+label+'</text><rect class="sp-series" x="82" y="'+(12+i*41)+'" width="'+[124,148,271,99][i]+'" height="17" rx="3"/><text x="'+(92+[124,148,271,99][i])+'" y="'+(24+i*41)+'">'+[124,148,271,99][i]+'</text>').join('')+'</svg></section>';}
  function history(narrow=false,tiles=false){return '<section class="sp-panel sp-history '+(narrow?'sp-narrow-history ':'')+(tiles?'sp-tiled-history':'')+'">'+title('Downloadverlauf','<span data-count></span>')+'<div class="sp-history-filters"><input type="search" data-search aria-label="Titel oder Streamer suchen" placeholder="Titel oder Streamer suchen"><select data-kind aria-label="Aufnahmeart"><option>Alle Typen</option><option>VOD</option><option>Clip</option><option>Live</option></select></div><div class="sp-history-list" data-list></div><div class="sp-history-pages"><span data-page-label></span>'+button('Zurück','previous')+button('Weiter','next')+'</div></section>';}
  function detail(record=records[0]) {return '<section class="sp-panel sp-detail" data-detail>'+detailContent(record)+'</section>';}
  function detailContent(r){return title('Download-Details')+'<img class="sp-cover" src="'+r.cover+'" alt="Vorschaubild des VODs"><h3>'+r.title+'</h3>'+channel(r.channel)+'<div class="sp-detail-fields"><div><span>Heruntergeladen</span><b>'+r.date+' · '+r.time+'</b></div><div><span>Status</span><b>Abgeschlossen</b></div><div><span>Dateigröße</span><b>'+r.size+'</b></div><div><span>Videolänge</span><b>'+r.duration+'</b></div><div><span>Qualität</span><b>Source · 1440p60</b></div><div><span>Aufnahmeart</span><b>'+r.kind+'</b></div></div>'+button('Datei öffnen','open-file','play')+button('Ordner öffnen','open-folder','folder-open');}
  function comparison(){return '<section class="sp-panel sp-comparison">'+title('Dieser Zeitraum / vorheriger')+'<div class="sp-note">19.09.–18.10.2026 gegenüber 20.08.–18.09.2026</div>'+[['Downloads','186','154'],['Datenmenge','742 GB','608 GB'],['Videolänge','438 h','367 h'],['Downloadzeit','19 h 12 min','17 h 04 min']].map(r=>'<div class="sp-comparison-item"><span>'+r[0]+'</span><b>'+r[1]+'</b><span>'+r[2]+'</span></div>').join('')+'<div class="sp-note">Abgeschlossene Downloads im jeweiligen Zeitraum</div></section>';}
  const nav=['Twitch VODs','Twitch Clips','Video schneiden','Videos zusammenfügen','Statistik','Archiv','Einstellungen'];
  const navIcons=['tv','clapperboard','scissors','combine','chart-no-axes-combined','archive','settings'];
  const stateByApp = new WeakMap();
  const tabs = labels => '<div class="sp-tabs" role="tablist" aria-label="Statistikbereich">'+labels.map((l,i)=>'<button type="button" role="tab" aria-selected="'+(i===0)+'" data-tab="'+i+'">'+l+'</button>').join('')+'</div>';
  const layouts=[
    () => kpis()+'<div class="sp-board sp-board-one">'+activity()+streamers()+inventory()+history()+'</div>',
    () => mini()+'<div class="sp-board sp-board-two">'+history()+'<div class="sp-stack">'+activity('line')+streamers()+inventory()+'</div></div>',
    () => '<div class="sp-board sp-board-three"><div class="sp-stack"><section class="sp-panel">'+title('Downloads')+mini()+'<div class="sp-note">Im Zeitraum abgeschlossen: 186<br>Fehlgeschlagen: 2 · Abgebrochen: 3</div></section>'+inventory()+'</div><div class="sp-stack">'+activity('line')+streamers()+sizes()+'</div>'+history(true)+'</div>',
    () => tabs(['Übersicht','Downloadverlauf','Dateibestand'])+'<div class="sp-tab-area" data-tab-panel="0">'+kpis()+'<div class="sp-board sp-board-four">'+activity('line')+streamers()+history(true)+'</div></div><div class="sp-tab-area" data-tab-panel="1" hidden>'+history()+'</div><div class="sp-tab-area" data-tab-panel="2" hidden><div class="sp-board">'+inventory()+sizes()+streamers()+'</div></div>',
    () => '<div class="sp-channel-nav" aria-label="Streamer auswählen">'+channels.map((c,i)=>'<button data-channel="'+i+'" aria-pressed="'+(i===0)+'">'+avatar(c)+'<span>'+c.name+'</span></button>').join('')+'</div>'+mini()+'<div class="sp-board sp-board-five">'+activity('line','Downloads des Kanals')+inventory()+streamers()+history()+sizes()+'</div>',
    () => '<div class="sp-day-nav" aria-label="Tag auswählen">'+['Mo, 12.10.','Di, 13.10.','Mi, 14.10.','Do, 15.10.','Fr, 16.10.','Sa, 17.10.','So, 18.10.'].map((d,i)=>'<button data-day="'+(12+i)+'" aria-pressed="'+(i===6)+'"><span>'+d+'</span><strong>6</strong><small>Downloads</small></button>').join('')+'</div><div class="sp-board sp-board-six">'+history()+'<div class="sp-stack">'+activity('bars','Aktivität dieser Woche')+inventory()+'</div></div>',
    () => '<div class="sp-board sp-board-seven"><div class="sp-stack">'+comparison()+activity('line')+'</div><div class="sp-stack">'+history()+streamers()+'</div></div>',
    () => mini()+tabs(['Downloadverlauf','Aktivität','Dateibestand'])+'<div class="sp-tab-area" data-tab-panel="0"><div class="sp-board sp-board-eight">'+history(false,true)+'</div></div><div class="sp-tab-area" data-tab-panel="1" hidden><div class="sp-board">'+activity('line')+streamers()+'</div></div><div class="sp-tab-area" data-tab-panel="2" hidden><div class="sp-board">'+inventory()+sizes()+'</div></div>',
    () => mini()+'<div class="sp-board sp-board-nine">'+activity('line')+detail()+history()+'</div>',
    () => '<div class="sp-board sp-board-ten"><section class="sp-panel sp-small-panel">'+title('Downloads · Letzte 30 Tage')+mini()+'</section><section class="sp-stack sp-small-panel">'+streamers()+'</section><section class="sp-stack sp-small-panel">'+inventory()+'</section>'+history()+'</div>'
  ];
  function periodRows(app){const s=stateByApp.get(app);return records.filter(r=>(s.range==='all'||r.offset<Number(s.range))&&(!s.channel||r.channel.name===s.channel)&&(!s.day||r.offset===18-s.day));}
  function rowsFor(app){const s=stateByApp.get(app);return periodRows(app).filter(r=>(s.kind==='Alle Typen'||r.kind===s.kind)&&((r.title+' '+r.channel.name).toLocaleLowerCase('de').includes(s.query.toLocaleLowerCase('de'))));}
  function refreshMetrics(app){
    const s=stateByApp.get(app),rows=periodRows(app),sum=(field)=>rows.reduce((a,r)=>a+r[field],0),hours=Math.floor(sum('seconds')/3600),mins=Math.floor(sum('seconds')%3600/60);
    const transfer=sum('seconds')*69120/1578240;
    const vals=[rows.length.toLocaleString('de-DE'),sum('sizeGB').toLocaleString('de-DE',{maximumFractionDigits:0})+' GB',hours.toLocaleString('de-DE')+' h '+mins+' min',Math.floor(transfer/3600).toLocaleString('de-DE')+' h '+Math.floor(transfer%3600/60)+' min'];
    app.querySelectorAll('[data-metric]').forEach(el=>el.textContent=vals[metrics.findIndex(m=>m[0]===el.dataset.metric)]);
    app.querySelectorAll('.sp-comparison').forEach(el=>{
      const span=s.range==='all'?Math.max(...records.map(r=>r.offset))+1:Number(s.range);
      const prior=records.filter(r=>r.offset>=span&&r.offset<span*2);
      const priorSeconds=prior.reduce((a,r)=>a+r.seconds,0),priorSize=prior.reduce((a,r)=>a+r.sizeGB,0),priorTransfer=priorSeconds*69120/1578240;
      const old=[prior.length.toLocaleString('de-DE'),priorSize.toLocaleString('de-DE',{maximumFractionDigits:0})+' GB',Math.floor(priorSeconds/3600)+' h '+Math.floor(priorSeconds%3600/60)+' min',Math.floor(priorTransfer/3600)+' h '+Math.floor(priorTransfer%3600/60)+' min'];
      const date=offset=>new Date(2026,9,18-offset).toLocaleDateString('de-DE');
      el.querySelector('.sp-note').textContent=date(span-1)+'–'+date(0)+' gegenüber '+date(span*2-1)+'–'+date(span);
      el.querySelectorAll('.sp-comparison-item').forEach((row,i)=>{row.querySelector('b').textContent=vals[i];row.lastElementChild.textContent=old[i];});
    });
    app.querySelectorAll('.sp-activity').forEach(el=>{const temp=document.createElement('div');temp.innerHTML=activity(el.dataset.chartMode,el.dataset.chartHeading,rows,s.range,Math.max(300,el.clientWidth-28),Math.max(140,el.querySelector('svg')?.clientHeight||180));el.innerHTML=temp.firstElementChild.innerHTML;});
    app.querySelectorAll('.sp-channels').forEach(el=>{const amounts=channels.map(c=>rows.filter(r=>r.channel.name===c.name).reduce((a,r)=>a+r.sizeGB,0));el.querySelector('.sp-panel-title>span').textContent=vals[1];el.querySelectorAll('.sp-streamer-row').forEach((row,i)=>{row.lastElementChild.textContent=amounts[i].toLocaleString('de-DE',{maximumFractionDigits:0})+' GB';row.querySelector('.sp-track>span').style.width=(amounts[i]/Math.max(1,...amounts)*100)+'%';});});
  }
  function refreshRows(app){const s=stateByApp.get(app),all=rowsFor(app);const visibleList=[...app.querySelectorAll('[data-list]')].find(el=>el.getBoundingClientRect().height>0);let count=5;if(visibleList){if(visibleList.closest('.sp-tiled-history')){const columns=app.clientWidth<=540?2:app.clientWidth<=1050?3:4;count=columns*Math.max(1,Math.floor(visibleList.clientHeight/190));}else count=Math.max(1,Math.min(12,Math.floor((visibleList.clientHeight-27)/(app.classList.contains('sp-compact')?45:59))));}s.pageSize=count;s.page=Math.min(s.page,Math.max(0,Math.ceil(all.length/count)-1));const shown=all.slice(s.page*count,(s.page+1)*count);app.querySelectorAll('[data-list]').forEach(list=>{
    if(list.closest('.sp-tiled-history'))list.innerHTML='<div class="sp-history-tiles">'+shown.map(r=>'<button class="sp-tile" data-record="'+r.id+'" aria-label="Details: '+r.title+'"><img class="sp-cover" src="'+r.cover+'" alt="VOD-Cover"><span class="sp-tile-info"><strong>'+r.title+'</strong><span class="sp-tile-bottom">'+channel(r.channel)+'<span class="sp-number">'+r.size+'</span></span><small class="sp-note">'+r.date+' · '+r.duration+'</small></span></button>').join('')+'</div>';
    else list.innerHTML='<div class="sp-history-head"><span>Aufnahme</span><span class="sp-channel-heading">Streamer</span><span class="sp-number">Größe</span><span class="sp-number sp-duration-heading">Videolänge</span><span class="sp-state-heading"></span></div>'+shown.map(r=>'<button type="button" class="sp-history-row" data-record="'+r.id+'" aria-pressed="'+(s.selected===r.id)+'" aria-label="Details: '+r.title+'"><span class="sp-record"><img class="sp-cover" src="'+r.cover+'" alt="VOD-Cover"><span class="sp-record-copy"><strong>'+r.title+'</strong><small>'+r.date+' · '+r.time+' · '+r.kind+'</small><span class="sp-inline-channel">'+avatar(r.channel)+r.channel.name+'</span></span></span>'+channel(r.channel)+'<span class="sp-number">'+r.size+'</span><span class="sp-number sp-duration">'+r.duration+'</span><span class="sp-success">'+icon('check')+'</span></button>').join('');if(!shown.length)list.innerHTML='<div class="sp-empty">Keine Downloads für diese Auswahl</div>';
  });app.querySelectorAll('[data-count]').forEach(el=>el.textContent=all.length.toLocaleString('de-DE')+' Einträge');app.querySelectorAll('[data-page-label]').forEach(el=>el.textContent=(all.length?s.page*count+1:0)+'–'+Math.min((s.page+1)*count,all.length)+' von '+all.length.toLocaleString('de-DE'));app.querySelectorAll('[data-action="previous"]').forEach(el=>el.disabled=s.page===0);app.querySelectorAll('[data-action="next"]').forEach(el=>el.disabled=(s.page+1)*count>=all.length);if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
  function toast(app,text){const el=app.querySelector('.sp-toast');el.textContent=text;el.hidden=false;clearTimeout(el.timer);el.timer=setTimeout(()=>el.hidden=true,2500);}
  function remember(app){const s=stateByApp.get(app);window.openai?.setWidgetState?.({modelContent:{design:app.closest('[data-variant]').dataset.variant},privateContent:{query:s.query,kind:s.kind}})?.catch(()=>{});}
  root.querySelectorAll(':scope > section[data-variant]').forEach((section,index)=>{
    section.innerHTML='<div class="sp-app" data-design="'+index+'" aria-label="Twitch Downloader – '+section.dataset.variant+'"><nav class="sp-nav" aria-label="Hauptnavigation"><div class="sp-brand"><img src="'+assets.logo+'" alt=""><div><b>Twitch Downloader</b><small>Entwickler-Version</small></div></div>'+nav.map((n,i)=>'<button type="button" data-action="navigation" '+(i===4?'aria-current="page"':'')+'>'+icon(navIcons[i])+'<span>'+n+'</span></button>').join('')+'</nav><main class="sp-main"><header class="sp-header"><h1>Statistik</h1><label class="sp-label">Zeitraum<select data-range><option value="30">Letzte 30 Tage</option><option value="7">Letzte 7 Tage</option><option value="90">Letzte 90 Tage</option><option value="all">Gesamt</option></select></label>'+button('Auswertungen','analyses','chart-column')+button('CSV exportieren','export','download')+button('Aktualisieren','refresh','refresh-cw')+'</header>'+layouts[index]()+'</main><footer class="sp-footer"><span><span class="sp-dot"></span>Public-Modus · öffentliche VODs verfügbar</span><span>v1.1.9</span></footer><div class="sp-modal-backdrop" hidden><section class="sp-modal" role="dialog" aria-modal="true" aria-label="Download-Details"><div class="sp-modal-title"><h2>Download-Details</h2>'+button('Schließen','close')+'</div><div data-modal-content></div></section></div><div class="sp-toast" role="status" hidden></div></div>';
    const app=section.firstElementChild;app.classList.toggle('sp-compact',index===9);stateByApp.set(app,{query:'',kind:'Alle Typen',page:0,range:'30',channel:index===4?channels[0].name:null,day:index===5?18:null,selected:0});refreshRows(app);refreshMetrics(app);
    app.addEventListener('input',e=>{if(e.target.matches('[data-search]')){const s=stateByApp.get(app);s.query=e.target.value;s.page=0;app.querySelectorAll('[data-search]').forEach(input=>input.value=s.query);refreshRows(app);remember(app);}});
    app.addEventListener('change',e=>{const s=stateByApp.get(app);if(e.target.matches('[data-kind]')){s.kind=e.target.value;s.page=0;refreshRows(app);}if(e.target.matches('[data-range]')){s.range=e.target.value;s.page=0;refreshRows(app);refreshMetrics(app);}remember(app);});
    app.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return;const s=stateByApp.get(app);if(target.hasAttribute('data-tab')){app.querySelectorAll('[data-tab]').forEach(el=>el.setAttribute('aria-selected',String(el===target)));app.querySelectorAll('[data-tab-panel]').forEach(el=>el.hidden=el.dataset.tabPanel!==target.dataset.tab);refreshRows(app);}if(target.hasAttribute('data-channel')){s.channel=channels[Number(target.dataset.channel)].name;s.page=0;app.querySelectorAll('[data-channel]').forEach(el=>el.setAttribute('aria-pressed',String(el===target)));refreshRows(app);refreshMetrics(app);}if(target.hasAttribute('data-day')){s.day=Number(target.dataset.day);s.page=0;app.querySelectorAll('[data-day]').forEach(el=>el.setAttribute('aria-pressed',String(el===target)));refreshRows(app);refreshMetrics(app);}if(target.hasAttribute('data-record')){const r=records[Number(target.dataset.record)];s.selected=r.id;const panel=app.querySelector('[data-detail]');if(panel)panel.innerHTML=detailContent(r);else{app.querySelector('.sp-modal').style.width='470px';app.querySelector('.sp-modal-title h2').textContent='Download-Details';app.querySelector('[data-modal-content]').innerHTML='<div class="sp-detail">'+detailContent(r)+'</div>';app.querySelector('.sp-modal-backdrop').hidden=false;app.querySelector('[data-action="close"]').focus();}refreshRows(app);}const action=target.dataset.action;if(action==='previous'||action==='next'){s.page+=action==='next'?1:-1;refreshRows(app);}if(action==='analyses'){app.querySelector('.sp-modal').style.width='920px';app.querySelector('.sp-modal-title h2').textContent='Auswertungen';app.querySelector('[data-modal-content]').innerHTML='<div class="sp-compare">'+inventory()+sizes()+'</div>'+activity('line');app.querySelector('.sp-modal-backdrop').hidden=false;refreshMetrics(app);}if(action==='close')app.querySelector('.sp-modal-backdrop').hidden=true;if(action==='refresh')toast(app,'Statistik aktualisiert');if(action==='open-file')toast(app,'Vorschau: Datei öffnen');if(action==='open-folder')toast(app,'Vorschau: Download-Ordner öffnen');if(action==='navigation')toast(app,'Statistik-Entwurf · '+target.textContent.trim());if(action==='export'){const csv='Titel;Streamer;Datum;Typ;Größe;Videolänge\n'+rowsFor(app).map(r=>[r.title,r.channel.name,r.date,r.kind,r.size,r.duration].join(';')).join('\n');app.querySelector('.sp-modal').style.width='920px';app.querySelector('.sp-modal-title h2').textContent='CSV-Vorschau';const box=document.createElement('textarea');box.readOnly=true;box.setAttribute('aria-label','CSV-Inhalt');box.style.cssText='width:100%;height:360px;resize:vertical;background:var(--sp-bg);color:var(--sp-text);border:1px solid var(--sp-line);border-radius:6px;padding:12px;font:12px/1.5 monospace';box.value=csv;app.querySelector('[data-modal-content]').replaceChildren(box);app.querySelector('.sp-modal-backdrop').hidden=false;app.querySelector('[data-action="close"]').focus();}remember(app);if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});});
    app.querySelector('.sp-modal-backdrop').addEventListener('click',e=>{if(e.target.classList.contains('sp-modal-backdrop'))e.target.hidden=true});app.addEventListener('keydown',e=>{if(e.key==='Escape')app.querySelector('.sp-modal-backdrop').hidden=true});
    let resizePending=false;new ResizeObserver(()=>{if(resizePending)return;resizePending=true;requestAnimationFrame(()=>{resizePending=false;refreshRows(app);refreshMetrics(app);});}).observe(app.querySelector('.sp-main'));
    if(globalThis.Tweak){const design={compact:index===9};const tweak=new Tweak({container:app,onChange:()=>{app.classList.toggle('sp-compact',design.compact);refreshRows(app);}});tweak.addToggle(design,'compact',{label:'Kompakter Downloadverlauf'});app.classList.toggle('sp-compact',design.compact);}
  });
  function restore(saved){
    if(!saved?.modelContent?.design)return;
    const section=[...root.querySelectorAll('[data-variant]')].find(el=>el.dataset.variant===saved.modelContent.design);
    const app=section?.querySelector('.sp-app');if(!app)return;
    const s=stateByApp.get(app),p=saved.privateContent||{};
    s.query=typeof p.query==='string'?p.query:'';s.kind=['Alle Typen','VOD','Clip','Live'].includes(p.kind)?p.kind:'Alle Typen';s.page=0;
    app.querySelectorAll('[data-search]').forEach(el=>el.value=s.query);app.querySelectorAll('[data-kind]').forEach(el=>el.value=s.kind);refreshRows(app);
  }
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState)restore(event.detail.globals.widgetState);});
  if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
})();
